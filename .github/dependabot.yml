# Monthly grouped version updates, with a 7-day cooldown so brand-new releases settle
# first. Dependabot alerts and security updates (repo settings) open right away, but
# they only see the exact pins in requirements.txt and the GitHub Actions below. The
# exe's full pinned set (constraints.txt, including transitive packages) is watched
# by the audit workflow (.github/workflows/audit.yml) instead.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    # Leave a >= floor alone when it already allows the new release, so only
    # exact pins (keyboard) get version PRs; floors stay documented minimums.
    versioning-strategy: increase-if-necessary
    # constraints.txt is the frozen release-build pin set, refreshed on purpose
    # (see its header); only security fixes should touch it.
    exclude-paths:
      - "constraints.txt"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      pip-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
