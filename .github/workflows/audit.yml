name: Audit pinned dependencies

# Checks constraints.txt (the exact package set baked into the release exe,
# transitive packages included) against known vulnerabilities. Dependabot
# alerts cannot see those transitive pins, so this is what watches them.
# A failed run is the notification. It deliberately has no pull_request
# trigger, so a newly published advisory never puts a red X on an unrelated
# PR; use "Run workflow" on any branch for a pre-merge check.

on:
  schedule:
    - cron: '17 6 * * 1'   # weekly, Monday 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'constraints.txt'
      - 'requirements.txt'
      - '.github/workflows/audit.yml'

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit constraints.txt
        # --no-deps: every line is an exact pin, so nothing is resolved.
        # --disable-pip: audit the pins as written instead of trial-installing them.
        # Without it pip-audit dry-run installs the set, which fails on this Linux
        # runner for Windows-only pins such as pywin32.
        run: pip-audit --no-deps --disable-pip -r constraints.txt
