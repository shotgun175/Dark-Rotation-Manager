name: CI

on:
  push:
    branches: [main]   # post-merge check; PRs are covered by pull_request below
  pull_request:

concurrency:
  # One in-flight run per ref; a newer push cancels the older, superseded run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q
