name: Build & Release

on:
  push:
    tags:
      - 'v*'   # triggers on any tag like v1.3.2, v2.0.0, etc.

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: pyinstaller --clean "Dark Rotation Manager.spec"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/Dark Rotation Manager.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
